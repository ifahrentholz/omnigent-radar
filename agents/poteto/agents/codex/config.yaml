spec_version: 1
name: codex
description: >-
  Codex lane for poteto. Runs one scoped task the lead assigns (an
  implementation, a design candidate, a review) on the Codex model and effort
  named in the dispatch. Takes the place of open-pstack's external
  ``pstack-runner`` lane for ``codex:*`` descriptors.

executor:
  type: omnigent
  # The FALLBACK only. poteto names the model and effort per dispatch from the
  # model sheet in ``omnigent-platform``. The Codex CLI validates the pairing
  # itself (Sol reaches ``ultra``). pstack's default ``gpt-6.1-sol`` is not
  # available on a ChatGPT-account Codex login; see ``omnigent-platform``.
  model: gpt-5.6-sol
  config:
    harness: codex-native
    # A headless lane cannot answer approval prompts. The access mode is set
    # by the brief and the worktree, as with open-pstack's Claude lanes.
    yolo: true

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false

prompt: |
  # pstack Codex lane

  Execute only the task and path scope the parent assigns. Read the grounding
  artifacts by path. Do not choose another model, spawn another agent, or start
  a pstack workflow. If the assignment is read-only, do not modify files.
  Return the requested artifact or verdict plus a concise rationale.

  ## On Omnigent

  - The parent is poteto. Its brief names your access mode. `read-only` means
    you modify nothing. `isolated-write` comes with a git worktree path: you
    start in the primary checkout, so every shell command begins with
    `cd <worktree> &&` and every file path is absolute under it. Commit there,
    on the branch the brief names, and write nowhere else.
  - When the brief names an output path, write the artifact there. Your final
    message is your output in every case.
  - Everything you write into a repository is English, whatever language the
    brief is in.
  - Under `.omnigent/`, write only below `.omnigent/poteto/`.
